/* ── Intersection-observer hook ─────────────────────────── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function AnimBlock({ children, animation = 'animate-fade-up', delay = '' }) {
  const [ref, visible] = useInView();
  return (
    <div ref={ref} className={`${visible ? animation : 'opacity-0'} ${delay}`} style={{ animationFillMode:'both' }}>
      {children}
    </div>
  );
}

/* ── Counter animation ──────────────────────────────────── */
function Counter({ target, suffix = '' }) {
  const [count, setCount] = useState(0);
  const [ref, visible] = useInView(0.3);
  useEffect(() => {
    if (!visible) return;
    let start = 0;
    const step = Math.ceil(target / 60);
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { setCount(target); clearInterval(timer); }
      else setCount(start);
    }, 20);
    return () => clearInterval(timer);
  }, [visible, target]);
  return <span ref={ref} className="stat-counter">{count.toLocaleString()}{suffix}</span>;
}

            <h2 className="mt-3 text-4xl md:text-5xl font-black">Winners <span className="shimmer-text">speak up</span></h2>
          </div>
        </AnimBlock>
        <div className="grid md:grid-cols-3 gap-6">
          {items.map((t, i) => (
            <AnimBlock key={i} animation={i===0?'animate-slide-left':i===2?'animate-slide-right':'animate-fade-up'} delay={`delay-${i*100}`}>
              <div className="card-hover glass rounded-3xl p-7 h-full flex flex-col">
                <div className="flex gap-1 mb-5">
                  {[...Array(5)].map((_,s) => <span key={s} className="text-[hsl(45,95%,55%)]">★</span>)}
                </div>
                <p className="text-[hsl(220,20%,75%)] leading-relaxed flex-1 mb-6">"{t.quote}"</p>
                <div className="flex items-center gap-3">
                  <img src={t.avatar} alt={t.name} className="w-10 h-10 rounded-full object-cover" />
                  <div>
                    <div className="font-semibold text-sm">{t.name}</div>
                    <div className="text-xs text-[hsl(220,20%,50%)]">{t.role}</div>
                  </div>
                </div>
              </div>
            </AnimBlock>
          ))}
        </div>
      </div>
    </section>
  );
}
